name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Publish destination after building artifacts"
        type: choice
        options:
          - none
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build_pypi_wheels:
    name: Build PyPI wheels
    uses: ./.github/workflows/build-pypi-wheels.yml

  publish_testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build_pypi_wheels
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/roboplan/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          pattern: python-distributions-*
          merge-multiple: true
          path: dist
      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build_pypi_wheels
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/roboplan/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          pattern: python-distributions-*
          merge-multiple: true
          path: dist
      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
