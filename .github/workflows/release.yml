name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Publish destination after building artifacts"
        type: choice
        options:
          - none
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

env:
  PACKAGE_NAME: roboplan-dimos
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  MAKEFLAGS: "-j2"
  NINJAFLAGS: "-j2"

jobs:
  check_version:
    name: Check package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Read package metadata
        id: package
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          project = pyproject["project"]
          if project["name"] != "roboplan-dimos":
              raise SystemExit(f"Unexpected package name: {project['name']}")
          print(f"version={project['version']}")
          PY
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: check_version
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist
        run: |
          rm -rf dist
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*.tar.gz
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-sdist
          path: dist/roboplan_dimos-*.tar.gz
          if-no-files-found: error

  build_wheels:
    name: Build Linux wheels
    runs-on: ubuntu-latest
    needs: check_version
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *-musllinux*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: >-
            CMAKE_BUILD_PARALLEL_LEVEL=2
            MAKEFLAGS="-j2"
            NINJAFLAGS="-j2"
          CIBW_TEST_COMMAND: >-
            python -c "import roboplan; import roboplan.core; import roboplan.filters; import roboplan.example_models;
            import roboplan.simple_ik; import roboplan.optimal_ik; import roboplan.rrt;
            import roboplan.toppra; import roboplan.cartesian_planning; print('roboplan-dimos imports ok')"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-linux
          path: wheelhouse/roboplan_dimos-*.whl
          if-no-files-found: error

  publish_testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs:
      - build_sdist
      - build_wheels
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/roboplan-dimos/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          pattern: python-distributions-*
          merge-multiple: true
          path: dist
      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - build_sdist
      - build_wheels
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/roboplan-dimos/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          pattern: python-distributions-*
          merge-multiple: true
          path: dist
      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
